<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FirmaExpress Pro</title>
    <meta name="darkreader-lock"> <!-- Bloquea extensiones como Dark Reader -->
    <link rel="stylesheet" href="styles.css?v=restore-a0d7c73">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .login-form input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: inherit;
            background-color: var(--surface-color);
            color: var(--text-primary);
        }
        .theme-toggle-login {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .signup-hint {
            margin-top: 18px;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: rgba(37, 99, 235, 0.06);
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.45;
        }
        .signup-hint a {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
        }
        .signup-hint a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="theme-toggle-login">
        <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>
    <main class="container login-container">
        <div class="card">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-file-signature" style="font-size: 2.5rem; color: var(--primary-color);"></i>
            </div>
            <h2>FirmaExpress Pro</h2>
            <p class="subtitle">Acceso al Panel de Gestión</p>
            
            <form id="loginForm" class="login-form">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit" class="btn btn-primary" id="btnLogin">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                </button>
                <div id="loginError" style="color: var(--danger-color); display: none; margin-top: 10px; font-size: 0.9rem;"></div>
            </form>
            <p class="signup-hint">
                Si aún no tenés una cuenta, podés obtenerla contratando el servicio
                <a href="https://wa.me/5492612404479?text=Hola%20Mati,%20quiero%20contratar%20FirmaExpress%20Pro" target="_blank">aquí</a>.
            </p>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p class="credits">Diseñado y Desarrollado en su totalidad por <strong>Matías Gómez</strong></p>
            <div class="contact-info">
                <a href="https://wa.me/5492612404479" target="_blank" class="contact-item">
                    <i class="fa-brands fa-whatsapp"></i> +54 9 2612404479
                </a>
                <a href="mailto:ftvmati2022@gmail.com" class="contact-item">
                    <i class="fa-solid fa-envelope"></i> ftvmati2022@gmail.com
                </a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    
    <script src="login.js"></script>
</body>
</html>
